name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hyperf_test
          MYSQL_USER: hyperf
          MYSQL_PASSWORD: hyperf
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: swoole, redis, pdo_mysql
        coverage: pcov

    - name: Install Dependencies
      run: composer install --prefer-dist --no-progress

    - name: Copy .env
      run: cp .env.example .env

    - name: Configure Environment
      run: |
        sed -i 's/DB_HOST=mysql/DB_HOST=127.0.0.1/' .env
        sed -i 's/REDIS_HOST=redis/REDIS_HOST=127.0.0.1/' .env
        sed -i 's/MAIL_HOST=mailhog/MAIL_HOST=127.0.0.1/' .env
        sed -i 's/SYSLOG_HOST=promtail/SYSLOG_HOST=127.0.0.1/' .env
        sed -i 's/DB_DATABASE=hyperf/DB_DATABASE=hyperf_test/' .env
        sed -i 's/METRIC_DRIVER=prometheus/METRIC_DRIVER=noop/' .env  

    - name: Run Migrations
      run: php bin/hyperf.php migrate
      env:
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: hyperf_test
        DB_USERNAME: hyperf
        DB_PASSWORD: hyperf

    - name: Run Unit Tests
      run: composer test:unit

    - name: Run Feature Tests
      run: composer test:feature

    - name: Run Integration Tests
      run: composer test:integration

    - name: Generate Coverage Report
      run: composer test:coverage
