name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hyperf_test
          MYSQL_USER: hyperf
          MYSQL_PASSWORD: hyperf
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: swoole, redis, pdo_mysql
        coverage: pcov

    - name: Install Dependencies
      run: composer install --prefer-dist --no-progress

    - name: Create .env for testing
      run: |
        cat > .env << EOF
        APP_NAME=tecnofit
        APP_ENV=testing
        DB_DRIVER=mysql
        DB_HOST=127.0.0.1
        DB_PORT=3306
        DB_DATABASE=hyperf_test
        DB_USERNAME=hyperf
        DB_PASSWORD=hyperf
        DB_CHARSET=utf8mb4
        DB_COLLATION=utf8mb4_unicode_ci
        DB_PREFIX=
        REDIS_HOST=127.0.0.1
        REDIS_AUTH=(null)
        REDIS_PORT=6379
        REDIS_DB=0
        METRIC_DRIVER=noop
        TELEMETRY_USE_STANDALONE_PROCESS=false
        TELEMETRY_ENABLE_DEFAULT_TELEMETRY=false
        EOF

    - name: Run Migrations
      run: php bin/hyperf.php migrate
      env:
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: hyperf_test
        DB_USERNAME: hyperf
        DB_PASSWORD: hyperf

    - name: Run Unit Tests
      run: composer test:unit

    - name: Run Feature Tests
      run: composer test:feature

    - name: Run Integration Tests
      run: composer test:integration

    - name: Generate Coverage Report
      run: composer test:coverage
